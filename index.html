<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b0b0b">
<script>
  // テーマを描画前に決める（DOC-03 §7.1）。設定：auto / light / dark
  (function () {
    var s = "auto";
    try { s = localStorage.getItem("tu.theme") || "auto"; } catch (e) {}
    var dark = s === "dark" || (s === "auto" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0b0b0b" : "#ffffff");
  })();
</script>
<title>The Universal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="viewer/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>

<header id="hud">
  <div class="brand">
    <div class="wordmark">THE UNIVERSAL</div>
    <div class="sub" id="ver">—</div>
    <button id="now" class="textbtn now" aria-pressed="false" aria-label="現在の学習範囲に絞る"></button>
  </div>
  <div class="hud-r">
    <button id="btn-search" class="textbtn" aria-label="Search">SEARCH</button>
    <button id="btn-menu" class="textbtn" aria-label="Menu"><span>MENU</span><i></i></button>
  </div>
</header>
<div id="chips" aria-live="polite"></div>

<div id="finder" class="hidden" role="dialog" aria-label="Search">
  <div class="finder-row">
    <input id="fq" type="search" placeholder="ノードを探す（例：エントロピー、CMB、産業革命）" autocomplete="off" enterkeyhint="search">
    <button id="finder-close" class="textbtn">CLOSE</button>
  </div>
  <ul id="finder-results" class="rows"></ul>
</div>

<div id="guide" class="hidden" role="dialog" aria-label="Guide">
  <div class="guide-card">
    <div class="kick">HOW TO USE</div>
    <ol>
      <li><b>タップ</b>　点（ノード）をタップすると、説明と関係が開きます。</li>
      <li><b>ドラッグ／ピンチ</b>　回転と拡大・縮小。右下の <b>− + FIT</b> でも操作できます。</li>
      <li><b>NOW</b>　左上をタップすると、いま学んでいる範囲だけが浮かびます。</li>
      <li><b>SEARCH／MENU</b>　探す、目次・教材・凡例・設定はここから。</li>
    </ol>
    <button id="guide-ok" class="textbtn">OK</button>
  </div>
</div>

<footer id="foot">
  <div class="modes" role="group" aria-label="View">
    <button class="textbtn on" data-mode="cyl">CYLINDER</button><span class="sep">/</span><button class="textbtn" data-mode="flat">UNROLLED</button><span class="sep">/</span><button class="textbtn" data-mode="plane">2D</button>
  </div>
  <div class="zoom" role="group" aria-label="Zoom">
    <span class="scale" id="scale" aria-live="polite">—</span>
    <button class="textbtn" id="zoom-out" aria-label="縮小">−</button><button class="textbtn" id="zoom-in" aria-label="拡大">+</button><button class="textbtn" id="zoom-fit" aria-label="全体を表示">FIT</button>
  </div>
</footer>

<section id="panel" class="hidden" aria-live="polite">
  <div class="grip"></div>
  <div class="panel-bar">
    <button id="panel-back" class="textbtn hidden" aria-label="直前のノードへ戻る">← BACK</button>
    <button id="panel-close" class="textbtn" aria-label="Close">CLOSE</button>
  </div>
  <div id="panel-body"></div>
</section>

<nav id="menu" class="hidden" aria-label="Menu">
  <div class="menu-head">
    <div class="wordmark">THE UNIVERSAL</div>
    <button id="menu-close" class="textbtn">CLOSE</button>
  </div>
  <div class="menu-body" id="menu-body">
    <div class="menu-nav">
      <div id="nowcard" class="nowcard"></div>
      <label class="search"><span>SEARCH</span><input id="q" type="search" placeholder="エントロピー、CMB、Transformer…" autocomplete="off"></label>
      <label class="search filter"><span>DOMAIN</span><select id="f-domain" aria-label="領域で絞り込む"><option value="">All domains（全領域）</option></select></label>
      <ul id="search-results" class="rows"></ul>
      <ol class="sections">
        <li><button data-sec="index"><em>01</em>Index</button></li>
        <li><button data-sec="lessons"><em>02</em>Lessons</button></li>
        <li><button data-sec="reports"><em>03</em>Reports</button></li>
        <li><button data-sec="questions"><em>04</em>Questions</button></li>
        <li><button data-sec="legend"><em>05</em>Legend</button></li>
        <li><button data-sec="about"><em>06</em>About</button></li>
        <li><button data-sec="settings"><em>07</em>Settings</button></li>
      </ol>
    </div>
    <div class="menu-content" id="menu-content"></div>
  </div>
</nav>

<div id="loading"><div class="wordmark">THE UNIVERSAL</div><small>LOADING THE MAP</small></div>
<script type="module" src="viewer/app.js"></script>
<script>
  // importmap 非対応（iOS 16.4 未満）や、CDN に届かない場合の案内
  setTimeout(function () {
    var l = document.getElementById("loading");
    if (l && !l.classList.contains("hidden")) {
      l.innerHTML = '<div class="wordmark">THE UNIVERSAL</div><small>地図を表示できませんでした。iOS 16.4 以降の Safari で、通信状態を確認して再読み込みしてください。</small>';
    }
  }, 15000);
</script>
</body>
</html>
